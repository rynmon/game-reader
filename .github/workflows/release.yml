name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node dependencies
        run: npm ci

      - name: Fetch Tesseract
        shell: pwsh
        run: |
          if (Test-Path "${env:ProgramFiles}\7-Zip\7z.exe") {
            ./scripts/fetch-tesseract.ps1
          } else {
            Write-Warning "7-Zip not available; skipping Tesseract fetch. Add binaries manually for OCR."
          }

      - name: Build Python engine sidecar
        shell: pwsh
        run: ./scripts/build-engine.ps1

      - name: Build Tauri installer
        run: npm run tauri build
        env:
          GAME_READER_ALLOW_HF_DOWNLOAD: "1"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: game-reader-windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
