name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v2.0.0)"
        required: true
        default: "v2.0.0"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install 7-Zip and Tesseract
        shell: pwsh
        run: |
          choco install 7zip tesseract -y --no-progress
          ./scripts/fetch-tesseract.ps1

      - name: Install Node dependencies
        run: npm ci

      - name: Build Python engine sidecar
        shell: pwsh
        run: ./scripts/build-engine.ps1
        env:
          PYTHONUNBUFFERED: "1"

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Tauri app
        run: npm run tauri build -- --no-bundle
        env:
          GAME_READER_ALLOW_HF_DOWNLOAD: "1"

      - name: Package portable Windows release
        shell: pwsh
        run: ./scripts/package-windows-release.ps1 -Tag "${{ steps.tag.outputs.name }}"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: Game Reader ${{ steps.tag.outputs.name }}
          generate_release_notes: true
          body: |
            ## Windows install (portable)

            1. Download **all** `Game-Reader-*-windows-x64.7z.*` parts into one folder.
            2. Extract with [7-Zip](https://www.7-zip.org/) (right-click the `.7z.001` file).
            3. Run `game-reader.exe` from the extracted folder.

            Requires **Windows 10/11**, **NVIDIA GPU with CUDA**, and the [WebView2 runtime](https://developer.microsoft.com/en-us/microsoft-edge/webview2/).
          files: |
            Game-Reader-*-windows-x64.7z.*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
